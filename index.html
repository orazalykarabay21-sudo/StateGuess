<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Менталист — викторина</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <header>
    <h1>🧠 Менталист</h1>
    <p class="subtitle">Викторина по сезонам</p>
  </header>

  <div id="menu" class="screen active">
    <p class="menu-text">Выбери сезон — в каждом по 20 вопросов.</p>
    <div id="season-list" class="season-list"></div>
  </div>

  <div id="quiz" class="screen">
    <div class="top">
      <div class="badge">Сезон <span id="season-num">1</span></div>
      <button id="back" class="back">← Меню</button>
    </div>
    <div class="bar"><div id="fill"></div></div>
    <p class="counter">Вопрос <span id="q-now">1</span> из <span id="q-total">20</span></p>
    <h2 id="question">Текст вопроса</h2>
    <div id="answers" class="answers"></div>
    <p id="feedback" class="feedback"></p>
    <button id="next" class="hidden">Далее →</button>
  </div>

  <div id="result" class="screen">
    <h2>Сезон <span id="r-season">1</span> завершён!</h2>
    <p class="score">Результат: <span id="r-score">0</span> / <span id="r-max">20</span></p>
    <p id="r-msg"></p>
    <button id="retry">Пройти заново</button>
    <button id="to-menu">Выбрать другой сезон</button>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
