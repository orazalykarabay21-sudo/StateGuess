header { text-align:center; margin-bottom:22px; }

.screen.active { display:block; }
.menu-text { text-align:center; color:#bbb; margin-bottom:18px; font-size:.95rem; }
.season-list { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
.season-btn {
  background:#1e1e1e; border:1px solid #333; border-radius:10px;
  padding:20px 8px; text-align:center; cursor:pointer; color:#ddd;
  transition:background .2s, border-color .2s;
}
.season-btn:active { background:#2a2a2a; border-color:#8b0000; }
.season-btn .num { font-size:1.8rem; color:#d32f2f; font-weight:bold; display:block; }
.season-btn .lbl { font-size:.8rem; color:#aaa; margin-top:4px; }
.top { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
.badge {
  background:#8b0000; color:#fff; padding:6px 14px; border-radius:20px;
  font-size:.8rem; letter-spacing:1px; text-transform:uppercase;
}
.back {
  background:transparent; border:1px solid #444; color:#bbb;
  padding:7px 12px; font-size:.8rem; border-radius:6px; cursor:pointer;
}
.bar { width:100%; height:6px; background:#2a2a2a; border-radius:3px; overflow:hidden; margin-bottom:14px; }
#fill { height:100%; width:0; background:linear-gradient(90deg,#8b0000,#d32f2f); transition:width .3s; }
.counter { color:#888; font-size:.85rem; margin-bottom:10px; }
#question { font-size:1.1rem; margin-bottom:18px; line-height:1.4; }
.answers { display:flex; flex-direction:column; gap:10px; }
.answer {
  background:#1e1e1e; border:1px solid #333; color:#ddd; padding:14px;
  border-radius:8px; text-align:left; font-size:.95rem; cursor:pointer;
  transition:background .2s, border-color .2s; width:100%;

.answer:active:not(:disabled) { background:#2a2a2a; border-color:#8b0000; }
.answer.correct { background:#1b5e20; border-color:#4caf50; color:#fff; }
.answer.wrong { background:#5d0000; border-color:#d32f2f; color:#fff; }
.feedback { margin-top:14px; min-height:24px; font-weight:bold; color:#d32f2f; font-size:.95rem; }
.feedback.correct { color:#4caf50; }
.hidden { display:none; }
button {

button:active:not(:disabled) { background:#b71c1c; }
.score { font-size:1.4rem; text-align:center; margin:18px 0; color:#d32f2f; }
#r-msg { text-align:center; color:#bbb; margin-bottom:18px; line-height:1.5; font-size:.95rem; }
